# Remote: https://github.com/Koumalabs/caesar — site at https://koumalabs.github.io/caesar/.
# One-time activation: Settings → Pages → Source: "GitHub Actions".
# Custom domain? Set baseUrl to '/' in website/docusaurus.config.ts and add website/static/CNAME.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter website build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
